<script type="module">
import {render} from '/src/engine.ts';import {defaults,presetState,randomizeSettings} from '/src/state.ts';
const $=s=>document.querySelector(s),state={...defaults};let image,selected='field',zoom=1,timer,panX=0,panY=0,locked=false,comparing=false;
const layers=[{id:'source',name:'Photograph',symbol:'▧',title:'The original',description:'The starting point for every study.'},{id:'field',name:'Geometry',symbol:'⌜ ⌟',title:'Geometry field',description:'Trace the structure. Leave room for the image.',controls:[['Node density','density',50,600,10],['Edge threshold','edgeThreshold',0,60,1],['Maximum labels','labelCount',1,30,1]]},{id:'contour',name:'Contours',symbol:'≋',title:'Topography',description:'Turn light and shadow into fine contours.',controls:[['Levels','levels',3,30,1],['Line width','lineWidth',.3,3,.1],['Opacity','contourOpacity',0,100,1]]},{id:'circleChain',name:'Orbit',symbol:'◎',title:'Orbital study',description:'A sequence of circles, unfolding into space.',controls:[['Circle count','chainCount',2,20,1],['Angle','chainAngle',0,180,1],['Radius','chainRadius',20,300,1]]},{id:'halftone',name:'Print',symbol:'⠿',title:'Print texture',description:'A photograph, translated into ink and paper.',controls:[['Dot spacing','spacing',4,30,1],['Dot scale','dotScale',.3,1.8,.1],['Screen angle','angle',0,90,1]]},{id:'portraitWindow',name:'Window',symbol:'□',title:'Portrait window',description:'A different treatment, within the frame.',controls:[['Width','windowWidth',10,100,1],['Height','windowHeight',10,100,1],['Horizontal position','windowX',0,100,1]]}];
function draw(){if(!image)return;const h=1800,w=Math.round(h*image.width/image.height);const result=render(image,state,w,h,comparing);const c=$('#canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(result,0,0);$('#art').style.aspectRatio=`${image.width}/${image.height}`;$('#loading').hidden=true;}

$('#inspector-content').innerHTML=`<h1>${l.title}</h1><p class="description">${l.description}</p>${controls}${l.id==='field'?'<div class="line"></div><div class="switch-row"><span>Node annotations</span><button class="switch" id="labels" aria-label="Node annotations" aria-pressed="'+state.nodeLabels+'"></button></div><p class="secondary">Sparse marks. Meaningful points.</p>':''}`;$('#inspector-content').querySelectorAll('input').forEach(input=>input.oninput=()=>{state[input.dataset.key]=Number(input.value);$('#out-'+input.dataset.key).textContent=input.value;state[selected]=true;$('#active').setAttribute('aria-pressed','true');tabs();schedule();});if($('#labels'))$('#labels').onclick=()=>{state.nodeLabels=!state.nodeLabels;panel();schedule()};if($('#replace'))$('#replace').onclick=()=>$('#file').click();}
$('#active').onclick=()=>{state[selected]=!state[selected];panel();schedule()};$('#upload').onclick=()=>$('#file').click();$('#file').onchange=async e=>{if(e.target.files[0]){const next=await createImageBitmap(e.target.files[0]);image?.close();image=next;draw();}};
function scale(){ $('#art').style.transform=`translate(${panX}px,${panY}px) scale(${zoom})`;$('#zoom').textContent=Math.round(zoom*100)+'%'}$('#plus').onclick=()=>{if(locked)return;zoom=Math.min(4,zoom+.25);scale()};$('#minus').onclick=()=>{if(locked)return;zoom=Math.max(.25,zoom-.25);scale()};$('#fit').onclick=()=>{if(locked)return;zoom=1;panX=panY=0;scale()};$('#lock').onclick=()=>{locked=!locked;$('#lock').setAttribute('aria-pressed',String(locked));$('#lock').innerHTML='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="5" y="10" width="14" height="11" rx="1"/><path d="M8 10V6a4 4 0 0 1 8 0'+(locked?'v4':'')+'"/></svg> '+(locked?'Unlock':'Lock');$('.pan-label').textContent=locked?'IMAGE LOCKED':'✥  DRAG TO PAN';};let drag;
$('.stage').onpointerdown=e=>{if(locked||e.button!==0)return;drag={x:e.clientX,y:e.clientY,px:panX,py:panY};$('.stage').setPointerCapture(e.pointerId);$('#art').style.transition='none';};$('.stage').onpointermove=e=>{if(!drag)return;panX=drag.px+e.clientX-drag.x;panY=drag.py+e.clientY-drag.y;scale();};$('.stage').onpointerup=$('.stage').onpointercancel=()=>{drag=null;$('#art').style.transition='';};$('.stage').addEventListener('wheel',e=>{e.preventDefault();if(locked)return;zoom=Math.max(.25,Math.min(4,zoom*Math.exp(-e.deltaY*.002)));scale()},{passive:false});

$('#randomize').onclick=()=>{Object.assign(state,randomizeSettings(state));panel();draw();};$('#field-random').onclick=()=>{state.field=true;state.seed=Math.floor(Math.random()*999999);panel();draw();};$('#compare').onclick=()=>{comparing=!comparing;$('#compare').setAttribute('aria-pressed',String(comparing));$('#image-mode').textContent=comparing?'ORIGINAL SOURCE':'PROCESSED IMAGE';draw();};
